name: 自动更新直播源

# 触发方式：每天定时 + 可手动触发
on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

# 允许工作流写入仓库内容
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成直播源
        run: python build_m3u.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新直播源 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
